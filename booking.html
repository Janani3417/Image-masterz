<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Premium Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  
  background:
    linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)),
    url("https://images.unsplash.com/photo-1529636798458-92182e662485");

  background-size: cover;
  background-position: center;
  color: white;
}

/* ⭐ EXACT SAME HEADER FROM HOME PAGE ⭐ */
header {
  width: 100%;
  background: #0b132b;     /* SAME COLOR */
  padding: 20px 40px;
  display: flex;
  align-items: center;
  position: fixed;
  top: 0;
  z-index: 200;
}

header img {
  width: 45px;
  margin-right: 10px;
}

header .brand {
  font-size: 28px;
  font-weight: bold;
  color: white;
}

header .brand span {
  color: #fbbf24;
}

nav {
  margin-left: auto;
  display: flex;
  gap: 40px;
}

nav a {
  text-decoration: none;
  color: white;
  font-size: 18px;
  padding-bottom: 5px;
  position: relative;
}

nav a.active {
  color: #fbbf24;
}

nav a.active::after {
  content: "";
  width: 30px;
  height: 3px;
  background: #fbbf24;
  position: absolute;
  bottom: -5px;
  left: 0;
  border-radius: 5px;
}

nav a:hover {
  color: #fbbf24;
}

/* MAIN LAYOUT */
.main {
  display: flex;
  min-height: 100vh;
  padding-top: 120px;  /* space for fixed header */
}

/* LEFT IMAGE */
.left {
  flex: 1;
  background: url("https://images.unsplash.com/photo-1522673607200-164d1b6ce486") center/cover;
  position: relative;
}

.left::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.7), transparent);
}

/* RIGHT FORM */
.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* FORM BOX */
.form-container {
  width: 100%;
  max-width: 420px;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.form-container h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* INPUTS */
.input-group {
  margin-bottom: 15px;
}

.input-group label {
  font-size: 14px;
  opacity: 0.8;
}

.input-group input,
.input-group textarea,
.input-group select {
  width: 100%;
  margin-top: 5px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-family: "Poppins";
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(45deg,#00c6ff,#0072ff);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* MOBILE */
@media(max-width:900px){
  .main {
    flex-direction: column;
  }

  .left {
    height: 250px;
  }
}

</style>
</head>

<body>

<!-- ⭐ SAME HEADER ADDED ⭐ -->
<header>
  <img src="assets/logo.png" alt="logo"/>
  <div class="brand">Image <span>Masterz</span></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="packages.html">Packages</a>
    <a href="booking.html" class="active">Booking</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="main">

<!-- LEFT IMAGE -->
<div class="left"></div>

<!-- RIGHT FORM -->
<div class="right">

<div class="form-container">
<h2>📸 Premium Booking</h2>

<form onsubmit="sendWhatsApp(); return false;">

<div class="input-group">
<label>Name</label>
<input type="text" id="name" required />
</div>

<div class="input-group">
<label>Date</label>
<input type="date" id="date" required />
</div>

<div class="input-group">
<label>Package</label>
<select id="package">
<option>Basic</option>
<option>Standard</option>
<option>Premium</option>
<option>Elite</option>
</select>
</div>

<div class="input-group">
<label>Event Type</label>
<input type="text" id="event" placeholder="Wedding / Birthday" />
</div>

<div class="input-group">
<label>Message</label>
<textarea id="message"></textarea>
</div>

<button type="submit">🚀 Book via WhatsApp</button>

</form>
</div>

</div>
</div>

<script>
function sendWhatsApp(){

let name = document.getElementById("name").value;
let date = document.getElementById("date").value;
let pack = document.getElementById("package").value;
let event = document.getElementById("event").value;
let message = document.getElementById("message").value;

let text = `Booking Request:
Name: ${name}
Date: ${date}
Package: ${pack}
Event: ${event}
Message: ${message}`;

let url = "https://wa.me/919876543210?text=" + encodeURIComponent(text);

window.open(url, "_blank");
}
</script>

</body>
</html>
