<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* ---------------- NAVBAR ---------------- */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 60px;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(6px);
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .nav-center {
        display: flex;
        gap: 30px;
      }

      .nav-center a {
        text-decoration: none;
        color: #e2e8f0;
        font-size: 18px;
      }

      .nav-center a:hover {
        color: white;
      }

      /* ---------- BACKGROUND ---------- */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(#0f1a2b, #162236);
        font-family: Arial, sans-serif;
        color: white;
      }

      /* ---------- MAIN (fix center issue) ---------- */
      .main {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 120px;
        background:
          linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)),
          url("https://images.unsplash.com/photo-1529636798458-92182e662485");

        background-size: cover;
        background-position: center; /* space for navbar */
      }

      /* ---------- FORM CONTAINER ---------- */
      .form-container {
        width: 100%;
        max-width: 550px;
        background: rgba(255, 255, 255, 0.09);
        padding: 40px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 28px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.17);
        color: white;
        font-size: 15px;
      }

      textarea {
        height: 100px;
        resize: none;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #4f8bfd;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
        color: white;
        margin-top: 15px;
      }

      button:hover {
        background: #3f76d9;
      }
    </style>
  </head>

  <body>
    <!-- ---------- HEADER NAVBAR ---------- -->
    <header class="navbar">
      <div class="logo">MyStudio</div>

      <nav class="nav-center">
        <a href="index.html">Home</a>
        <a href="Services.html">Services</a>
        <a href="packages.html">Packages</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <!-- ---------- MAIN CONTENT ---------- -->
    <div class="main">
      <div class="form-container">
        <h2>📸 Book Your Event</h2>

        <form
          onsubmit="
            sendWhatsApp();
            return false;
          "
        >
          <div class="input-group">
            <label>Name</label>
            <input
              type="text"
              id="name"
              required
              placeholder="Enter your Name"
            />
          </div>

          <div class="input-group">
            <label>Date</label>
            <input type="date" id="date" required />
          </div>

          <div class="input-group">
            <label>Event Type</label>
            <input type="text" id="event" placeholder="Wedding / Birthday" />
          </div>

          <div class="input-group">
            <label>Message</label>
            <textarea id="message" placeholder="message"></textarea>
          </div>

          <button type="submit">🚀 Book Now</button>
        </form>
      </div>
    </div>

    <script>
      function sendWhatsApp() {
        let name = document.getElementById("name").value;
        let date = document.getElementById("date").value;
        let event = document.getElementById("event").value;
        let msg = document.getElementById("message").value;

        let whatsappURL =
          "https://wa.me/91XXXXXXXXXX?text=" +
          "Booking Details:" +
          "%0A%0AName: " +
          name +
          "%0ADate: " +
          date +
          "%0AEvent: " +
          event +
          "%0AMessage: " +
          msg;

        window.open(whatsappURL, "_blank");
      }
    </script>
  </body>
</html>
