<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background:
  linear-gradient(rgba(10,10,10,0.7),rgba(10,10,10,0.9)),
  url("https://images.unsplash.com/photo-1529636798458-92182e662485");
  background-size:cover;
  background-position:center;
  color:white;
}

/* HEADER */
header{
  width:100%;
  background:#0b132b;
  display:flex;
  align-items:center;
  padding:20px 40px;
  position:fixed;
  top:0;
  z-index:200;
}
header img{width:45px;margin-right:10px;}
header .brand{
  font-size:28px;font-weight:bold;color:white;
}
header .brand span{color:#fbbf24;}
nav{
  margin-left:auto;display:flex;gap:40px;
}
nav a{
  text-decoration:none;color:white;font-size:18px;
}
nav a.active, nav a:hover{color:#fbbf24;}

/* MAIN */
.main{margin-top:140px;padding:20px;}

/* GRID */
.contact-row{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

/* BOX STYLE */
.box{
  width:350px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
}

.contact-item{
  display:flex;align-items:center;gap:10px;margin:10px 0;
}
.contact-item i{color:#fbbf24;}
.social a{font-size:20px;margin-right:10px;color:white;}
.social a:hover{color:#fbbf24;}

/* FORM */
.box input, .box textarea{
  width:100%;padding:10px;margin-top:10px;
  border-radius:10px;background:rgba(255,255,255,0.08);
  border:none;color:white;outline:none;
}
.box button{
  width:100%;padding:12px;margin-top:15px;
  border:none;border-radius:20px;
  background:#25d366;color:white;cursor:pointer;
}
.box button:hover{transform:scale(1.05);}

/* RATING */
.rating i{
  font-size:25px;color:#777;cursor:pointer;
}
.rating i.active{color:#ffd700;}

/* MAP */
.map iframe{
  width:100%;height:300px;border:none;border-radius:15px;
}

.footer{text-align:center;margin-top:40px;opacity:0.7;}

</style>
</head>

<body>

<header>
  <img src="assets/logo.png" alt="logo"/>
  <div class="brand">Image <span>Masterz</span></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="packages.html">Packages</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<div class="main">

<div class="contact-hero" style="text-align:center;margin-bottom:30px;">
  <h1>Let’s Work Together 📸</h1>
</div>

<div class="contact-row">

<!-- BOX 1 -->
<div class="box">
<h2>Contact Info</h2>

<div class="contact-item"><i class="fa-solid fa-phone"></i> +91 9876543210</div>
<div class="contact-item"><i class="fa-solid fa-envelope"></i> mystudio@gmail.com</div>
<div class="contact-item"><i class="fa-solid fa-location-dot"></i> Chennai, India</div>

<div class="social">
<a href="#"><i class="fa-brands fa-instagram"></i></a>
<a href="#"><i class="fa-brands fa-facebook"></i></a>
<a href="#"><i class="fa-brands fa-youtube"></i></a>
</div>
</div>

<!-- BOX 2 – SEND MESSAGE -->
<div class="box">
<h2>Send Message</h2>

<form action="https://formsubmit.co/haribca40@gmail.com" method="POST">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New message from Image Masterz">
    <input type="hidden" name="_autoresponse" value="Thanks for contacting us!">
    
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" required placeholder="Message"></textarea>

    <button type="submit">Send</button>
</form>
</div>

<!-- BOX 3 -->
<div class="box">
<h2>Write Review ⭐</h2>

<input type="text" id="rname" placeholder="Your Name">

<div class="rating" id="rating">
  <i onclick="rate(1)" class="fa-solid fa-star"></i>
  <i onclick="rate(2)" class="fa-solid fa-star"></i>
  <i onclick="rate(3)" class="fa-solid fa-star"></i>
  <i onclick="rate(4)" class="fa-solid fa-star"></i>
  <i onclick="rate(5)" class="fa-solid fa-star"></i>
</div>

<textarea id="rtext" placeholder="Your Review"></textarea>

<button onclick="saveReview()">Submit Review</button>
</div>

</div>

<div class="map">
<iframe src="https://maps.google.com/maps?q=chennai&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

<footer class="footer">© 2026 Image Masterz | All Rights Reserved</footer>

</div>

<script>

/* ⭐ STAR RATING */
let ratingValue = 0;
function rate(v){
  ratingValue = v;
  let stars=document.querySelectorAll("#rating i");
  stars.forEach((s,i)=> s.classList.toggle("active", i < v));
}

/* ⭐ REVIEW SAVE */
function saveReview(){
  let name=document.getElementById("rname").value;
  let text=document.getElementById("rtext").value;

  if(ratingValue===0){alert("Select star rating!");return;}

  let reviews=JSON.parse(localStorage.getItem("reviews")||"[]");
  reviews.push({name:name,text:text,stars:ratingValue});
  localStorage.setItem("reviews",JSON.stringify(reviews));

  alert("Review Submitted!");
  window.location.href="index.html";
}

</script>

</body>
</html>
