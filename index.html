<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Image Masterz</title>

<link rel="icon" type="image/png" sizes="32x32" href="image/logo2.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="index.css" />

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

/* ===== REVIEW SECTION ===== */
.review-section {
  padding: 80px 20px;
  text-align: center;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

.review-section h2 {
  margin-bottom: 40px;
}

/* REVIEW CARDS */
.review-cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
}

.review-card {
  width: 280px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  text-align: left;
  transition: 0.3s;
}

.review-card:hover {
  transform: translateY(-8px);
}

.review-card h4 {
  margin-bottom: 5px;
}

.review-card .stars {
  color: gold;
  font-size: 14px;
  margin-bottom: 10px;
}

.review-card p {
  font-size: 14px;
  opacity: 0.8;
}

.avatar {
  width: 40px;
  height: 40px;
  background: #fbbf24;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-bottom: 10px;
}

/* MOBILE */
@media(max-width:768px){
  .review-card {
    width: 90%;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="navbar">
  <div class="logo">
    <img src="image/logo2.png" alt="logo" />
    <h2>Image <span>Masterz</span></h2>
  </div>

  <nav class="nav-menu">
    <a href="#" class="active">Home</a>
    <a href="Services.html">Services</a>
    <a href="packages.html">Packages</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1 class="highlight">
      Freeze Your Beautiful Moments
      <img src="image/logo2.png" class="brand-logo" />
    </h1>
    <p>Capturing Weddings, Events & Timeless Memories</p>
    <br />
    <a href="booking.html" class="btn">Book Your Session</a>
  </div>
</section>

<!-- ✅ DYNAMIC REVIEW SECTION -->
<section class="review-section">

<h2>Client Reviews ✨</h2>

<div id="review-list" class="review-cards"></div>

</section>

<script>
function loadReviews() {
  let container = document.getElementById("review-list");
  let reviews = JSON.parse(localStorage.getItem("reviews") || "[]");

  if (reviews.length === 0) {
    container.innerHTML = "<p>No reviews yet</p>";
    return;
  }

  container.innerHTML = "";

  reviews.forEach(r => {

    let stars = "⭐".repeat(r.stars);
    let firstLetter = r.name.charAt(0).toUpperCase();

    container.innerHTML += `
      <div class="review-card">
        <div class="avatar">${firstLetter}</div>
        <h4>${r.name}</h4>
        <div class="stars">${stars}</div>
        <p>${r.text}</p>
      </div>
    `;
  });
}

loadReviews();
</script>

</body>
</html>
